apiVersion: v1
kind: Service
metadata:
  name: "lb-service"
  namespace: roboshop
spec:
  type: LoadBalancer
  selector:
    is: "LoadBalancer-match"
    author: jansi
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
          

# Service selector labels must be a subset of Pod labels.
# All selector key-value pairs must match.
# Pod can have extra labels.
