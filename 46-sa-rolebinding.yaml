apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader-binding
  namespace: roboshop
subjects:
  - kind: serviceAccount
    name:  app-reader
    apiGroup: rbac.authorization.k8s.io
roleRef:
   kind: Role
   name: read-pods
   apiGroups: rbac.authorization.k8s.io    


# Give Role read-pods to ServiceAccount pod-reader inside roboshop namespace.


# reader-pod
#     ↓ runs as
# ServiceAccount: pod-reader
#     ↓ connected through
# RoleBinding: pod-reader-binding
#     ↓ receives permissions from
# Role: read-pods
#     ↓
# Can get/list/watch Pods
#     ↓
# Only in roboshop namespace


# Application inside Pod(ServiceAccount credentials stored in conatiner - token,cert)
#         ↓
# Reads ServiceAccount token
#         ↓
# Sends HTTPS request to API server
#         ↓
# API server authenticates token
#         ↓
# Identity becomes:
# system:serviceaccount:roboshop:pod-reader
#         ↓
# RBAC authorization checks permissions
#         ↓
# Request allowed or rejected