apiVersion: apps/v1
kind: Deployment
metadata:
  name: blue-deployment
  namespace: roboshop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: roboshop
      color: blue
  template:
    metadata:
      labels:
        app: roboshop
        color: blue
    spec:
      containers:
        - name: blue-container
          image: nginx:1.30
          ports:
            - containerPort: 80
