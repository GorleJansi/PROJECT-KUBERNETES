apiVersion: apps/v1
kind: Deployment
metadata:
  name: green-deployment
  namespace: roboshop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: roboshop
      color: green
  template:
    metadata:
      labels:
        app: roboshop
        color: green
    spec:
      containers:
        - name: green-container
          image: nginx:1.31
          ports:
            - containerPort: 80
