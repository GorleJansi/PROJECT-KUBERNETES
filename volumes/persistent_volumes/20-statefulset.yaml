apiVersion: v1      #headless service
kind: Service
metadata:
  name: "statefulset-headless-service"
spec:
  clusterIP: None
  selector:
    author: jansi
    project: "roboshop-statefulset-test" 
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80

---
apiVersion: v1    #cluster-ip service
kind: Service
metadata:
  name: "Statefulset-clusterip-service"
spec:
  selector:
    author: jansi
    project: "roboshop-statefulset-test" 
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80

---

apiVersion: v1
kind: Statefulset
metadata:
  name: "statefulset-test"
  labels:
    project: "roboshop-statefulset-test"
spec:
  replicas: 3
  serviceName: statefulset-headless-service       # mention headless service 
  selector:
    author: jansi
    project: "roboshop-statefulset-test"  
  template:
    metadata:
      labels:
        author: jansi
        project: "roboshop-statefulset-test"
    spec:
      containers:
        - name: "roboshop-statefulset-container"
          image: nginx
          ports:
            - containerPort: 80
          volumeMounts:
            - name: stateful volume
              mountPath: /usr/share/nginx/html
      volumeClaimTemplates:         #pvc
        - metadata: 
            name: stateful volume
          spec:
            accessModes: 
              - ReadWriteOnce
            storageClassName: "ebs-storageclass"
            resources:
              requests:
              storage: 1Gi

      # volumes:
      #   - name: stateful volume
      #     persistentVolumeClaim:
      #       claimName: <name>         









# stateful set should have pvc,clusterip-service,headless service