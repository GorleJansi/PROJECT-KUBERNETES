apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: logging-demo
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: kubernetes-centralized-logging
    component: frontend
    project: central-logging
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
      component: frontend
      project: central-logging
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        component: frontend
        project: central-logging
    spec:
      containers:
        - name: frontend
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              count=1
              while true; do
                if [ $((count % 10)) -eq 0 ]; then
                  printf '{"service":"frontend","level":"ERROR","message":"frontend upstream timeout","request_id":"frontend-%s"}\n' "$count"
                else
                  printf '{"service":"frontend","level":"INFO","message":"frontend request completed","request_id":"frontend-%s"}\n' "$count"
                fi
                count=$((count + 1))
                sleep 5
              done
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
