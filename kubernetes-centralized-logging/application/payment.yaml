apiVersion: apps/v1
kind: Deployment
metadata:
  name: "payment-ds"
  namespace: logging
  labels:
    component: payment
    project: central-logging
spec:
  replicas: 2
  selector:
    matchLabels:
      component: payment
      project: central-logging    
  template:
    metadata:
      labels:
        component: payment
        project: central-logging 
    spec:      
      containers:
        - name: "payment-c"
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              count=1
              while true; do
                if [ $((count % 10)) -eq 0 ]; then
                  echo "{\"service\":\"payment\",\"level\":\"ERROR\",\"message\":\"database connection failed\",\"request_id\":\"req-$count\"}"
                else
                  echo "{\"service\":\"payment\",\"level\":\"INFO\",\"message\":\"payment request completed\",\"request_id\":\"req-$count\"}"
                fi
                count=$((count + 1))
                sleep 5
              done
          
