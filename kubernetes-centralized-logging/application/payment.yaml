apiVersion: apps/v1
kind: Deployment
metadata:
  name: "cart-ds"
  labels:
    component: cart
    project: central-logging
spec:
  replicas: 2
  selector:
    matchLabels:
      component: cart
      project: central-logging    
  template:
    metadata:
      containers:
        - name: "cart-c"
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              count=1
              while true; do
                if [ $((count % 10)) -eq 0 ]; then
                  echo "{\"service\":\"cart\",\"level\":\"ERROR\",\"message\":\"database connection failed\",\"request_id\":\"req-$count\"}"
                else
                  echo "{\"service\":\"cart\",\"level\":\"INFO\",\"message\":\"cart request completed\",\"request_id\":\"req-$count\"}"
                fi
                count=$((count + 1))
                sleep 5
              done
          
