apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  namespace: logging-demo
  labels:
    app.kubernetes.io/name: payment
    app.kubernetes.io/part-of: kubernetes-centralized-logging
    component: payment
    project: central-logging
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: payment
      component: payment
      project: central-logging
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payment
        component: payment
        project: central-logging
    spec:
      containers:
        - name: payment
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              count=1
              while true; do
                if [ $((count % 6)) -eq 0 ]; then
                  printf '{"service":"payment","level":"ERROR","message":"payment provider rejected transaction","request_id":"payment-%s"}\n' "$count"
                else
                  printf '{"service":"payment","level":"INFO","message":"payment transaction completed","request_id":"payment-%s"}\n' "$count"
                fi
                count=$((count + 1))
                sleep 5
              done
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
