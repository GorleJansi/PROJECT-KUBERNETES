apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart
  namespace: logging-demo
  labels:
    app.kubernetes.io/name: cart
    app.kubernetes.io/part-of: kubernetes-centralized-logging
    component: cart
    project: central-logging
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cart
      component: cart
      project: central-logging
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cart
        component: cart
        project: central-logging
    spec:
      containers:
        - name: cart
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              count=1
              while true; do
                if [ $((count % 8)) -eq 0 ]; then
                  printf '{"service":"cart","level":"ERROR","message":"cart cache lookup failed","request_id":"cart-%s"}\n' "$count"
                else
                  printf '{"service":"cart","level":"INFO","message":"cart item processed","request_id":"cart-%s"}\n' "$count"
                fi
                count=$((count + 1))
                sleep 5
              done
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
