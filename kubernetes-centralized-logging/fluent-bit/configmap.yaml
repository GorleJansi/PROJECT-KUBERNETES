apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: logging
  labels:
    app.kubernetes.io/name: fluent-bit
    app.kubernetes.io/part-of: kubernetes-centralized-logging
    project: central-logging
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         1
        Daemon        Off
        Log_Level     info
        Parsers_File  /fluent-bit/etc/parsers.conf
        HTTP_Server   On
        HTTP_Listen   0.0.0.0
        HTTP_Port     2020

    [INPUT]
        Name              tail
        Tag               kube.*
        Path              /var/log/containers/*.log
        Parser            cri
        DB                /fluent-bit/state/flb_kube.db
        Mem_Buf_Limit     10MB
        Skip_Long_Lines   On
        Refresh_Interval  10
        Rotate_Wait       30

    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443                                  
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Merge_Log           On
        Keep_Log            Off
        K8S-Logging.Parser  On
        K8S-Logging.Exclude Off

    [FILTER]
        Name   modify
        Match  kube.*
        Add    cluster eks-dev

    [OUTPUT]
        Name          loki
        Match         kube.*
        Host          loki-gateway.logging.svc.cluster.local
        Port          80
        URI           /loki/api/v1/push
        Labels        cluster=eks-dev, namespace=$kubernetes['namespace_name'], pod=$kubernetes['pod_name'], container=$kubernetes['container_name'], component=$kubernetes['labels']['component']
        Line_Format   json
        Retry_Limit   False

  parsers.conf: |
    [PARSER]
        Name        cri
        Format      regex
        Regex       ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z


---
# in-cluster API-server address available to Pods
# Pods inside the cluster can reach the API server using:
# https://kubernetes.default.svc:443

# Fluent Bit Pod
#       │
#       │ HTTPS
#       ▼
# kubernetes.default.svc:443
#       │
#       ▼
# Kubernetes API server

# In daemonset 
# spec:
#   serviceAccountName: fluent-bit

# Therefore, K8s runs the Fluent Bit Pod using this identity system:serviceaccount:logging:fluent-bit
# K8s automatically mounts credentials for that ServiceAccount(token,apiserver certificate,namespace) into the Pod.