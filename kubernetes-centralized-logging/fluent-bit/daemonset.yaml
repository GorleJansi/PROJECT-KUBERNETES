apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: logging
  labels:
    app.kubernetes.io/name: fluent-bit
    app.kubernetes.io/part-of: kubernetes-centralized-logging
    project: central-logging
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: fluent-bit
      project: central-logging
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fluent-bit
        project: central-logging
    spec:
      serviceAccountName: fluent-bit                # every Fluent Bit Pod runs with the identity: system:serviceaccount:logging:fluent-bit , Think of it as the Kubernetes identity of the Fluent Bit application.
      terminationGracePeriodSeconds: 30
      tolerations:
        - operator: Exists
      containers:                               #K8s provides the Fluent Bit container with: ServiceAccount token,K8s cluster CA certificate,K8s API server information ; 
        - name: fluent-bit
          image: cr.fluentbit.io/fluent/fluent-bit:3.2
          imagePullPolicy: IfNotPresent
          args:
            - -c
            - /fluent-bit/etc/fluent-bit.conf
          ports:
            - name: http-metrics
              containerPort: 2020
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: dockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: config
              mountPath: /fluent-bit/etc
              readOnly: true
            - name: state
              mountPath: /fluent-bit/state
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
            type: Directory
        - name: dockercontainers
          hostPath:
            path: /var/lib/docker/containers
            type: DirectoryOrCreate
        - name: config
          configMap:
            name: fluent-bit-config
        - name: state
          hostPath:
            path: /var/lib/fluent-bit
            type: DirectoryOrCreate











# Inside the Pod, the Fluent Bit program runs. That program:

# Reads a log filename.
# Extracts the Pod name and namespace from the filename.
# Sends an HTTPS request to the Kubernetes API server.
# Receives Pod information as JSON.
# Adds that information to the log.
# Pod
# └── Fluent Bit container
#        └── Fluent Bit process
#               └── Sends HTTPS request to API server