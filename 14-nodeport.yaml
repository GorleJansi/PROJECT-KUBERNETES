apiVersion: v1
kind: Service
metadata:
  name: "service-nodeport"
  namespace: roboshop
spec:
  type: NodePort
  selector:
    is:  "service-nodeport-match" 
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80.     # Pod/container port
      nodePort: 30080     #Port opened on every worker node


# Node IP:30080
#       ↓
# Service port:80
#       ↓
# Pod port:80
# opens 30080  and add kube-proxy network rules on all nodes;
# to access specific app we can use any nodeip:nodeport kube-proxy network rules on node will call specific nodeportservice and kubernetes dns converts to clusterip  and service  will select one of  any healthy  endpoints


#nodeport will decide which service(ex: frontend service has --> 30081) to send;service(frontend service ) will give trafic to pods(frontend app)

# NodePort is not given to a Pod.NodePort is given to a Service.
# That Service opens the same port on every worker node.