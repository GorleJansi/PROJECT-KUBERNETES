apiVersion: apps/v1
kind: Depolyment
metadata: 
  name: generated-config
  namespace: roboshop
spec:
  selector:   
    matchLabels:
      app: roboshop
      component: catalogue
  template:

    volumes:
      - name: generated-config        # emptydir creates shared volume for containers in underlying node ;emphermal volume
        emptyDir: {} 
        
      - name: application-data
        persistentVolumeClaim:        # pvc creates claim which calls storage class which will create ebs and pv which refers ebs ;persistent  volume exists even if pod is deleted
          claimName: catalogue-data  

    initContainers:
      # Init container 1: validate MongoDB connectivity
      - name: "wait-for-mongodb"
        - sh
        - -c
        - |
          echo "trying to connect mongodb...!"
          attempt=1
          max_attempts=30
          until nc -zv mongodb:27107
          do
            if [ $attempt -ge $max_attempts ]; then
                  echo "MongoDB was not reachable after 30 attempts."
                  exit 1
            fi
              echo "Attempt $attempt: MongoDB not reachable."
              attempt=$((attempt + 1))
              sleep 5
          done  

       # Init container 2: generate application config  
      - name: prepare-config
        image: busybox:1.36
        command:
          - sh
          - -c
          - |
             cat <<EOF> /generated/application.properties
              mongodb.host=mongodb
              mongodb.port=27017
              mongodb.database=catalogue
              server.port=8080
              environment=production
              EOF
        echo "Application configuration generated."

        volumeMounts:
          - name: generated-config    # generated-config data is mounted on emptydirty;
            mountPath: /generated     

         # Init container 3: correct volume permissions   
      - name: fix-volume-permissions
        image: busybox:1.36
        command:
          - sh
          - -c
          - |
            chown -R 1000:1000 /app/data
            chmod -R 750 /app/data
            echo "Volume permissions configured."
        volumeMounts:
          - name: application-data
            mountPath: /app/data

    containers:
      - name: catalogue 
        image: joindevops/catalogue:v1
        ports:
          - containerPort: 8080
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false  
        env:
          - name: configfile
            value: /app/config/application.properties
            volumeMounts:
              - name: generated-config      # generated-config data is mounted on emptydirty; can be accessed by /app/config
                mountPath: /app/config
                readOnly: true

              - name: application-data
                mountPath: /app/data
        readinessProbe:
          httpGet:
            path: /heath
            port: 8080
          intialDelaySeconds: 5
          PeriodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          intialDelaySeconds: 5
          PeriodSeconds: 10 
        resources:
          requests:
            cpu: 100m
            memory: 150Mi
          limits:
            cpu: 120m
            memory: 200Mi     
